<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">
<title>My Portfolio</title>
<style>
/* =========================================
   BASIC
========================================= */
* {
    box-sizing: border-box;
}
html {
    scroll-behavior: smooth;
}
body {
    margin: 0;

    font-family:
        Arial,
        sans-serif;

    background:
        var(--background);

    color:
        var(--text);

    overflow-x: hidden;

    transition:
        background .5s ease,
        color .5s ease;
}
/* =========================================
   VARIABLES
========================================= */
:root {
    --primary: #2563eb;

    --secondary: #0f172a;

    --background: #f8fafc;

    --text: #111827;

    --card: #ffffff;

    --muted: #64748b;
}
/* =========================================
   NAVBAR
========================================= */
nav {
    position: sticky;
    top: 0;
    z-index: 1000;
    display: flex;
    justify-content:
        space-between;
    align-items:
        center;
    padding:
        18px 7%;
    background:
        rgba(255,255,255,.85);
    backdrop-filter:
        blur(15px);
    box-shadow:
        0 5px 25px
        rgba(0,0,0,.08);
    animation:
        navDown .8s ease;
}
.logo {
    font-size:
        24px;
    font-weight:
        bold;
    color:
        var(--primary);
}
nav a {
    color:
        var(--text);
    text-decoration:
        none;
    margin-left:
        20px;
    transition:
        .3s;
}
nav a:hover {
    color:
        var(--primary);
}
/* =========================================
   HERO
========================================= */
.hero {
    min-height:
        85vh;
    display:
        flex;
    justify-content:
        center;
    align-items:
        center;
    text-align:
        center;
    padding:
        80px 20px;
    color:
        white;
    position:
        relative;
    overflow:
        hidden;
    background:
        linear-gradient(
            135deg,
            var(--secondary),
            var(--primary)
        );
    background-size:
        300% 300%;
    animation:
        gradientMove 10s ease infinite;
}
/* Animated circles */
.hero::before {
    content:
        "";
    position:
        absolute;
    width:
        400px;
    height:
        400px;
    border-radius:
        50%;
    background:
        rgba(255,255,255,.08);
    filter:
        blur(10px);
    left:
        -150px;
    top:
        -150px;
    animation:
        floatingCircle 8s
        ease-in-out infinite;
}
.hero::after {
    content:
        "";
    position:
        absolute;
    width:
        350px;
    height:
        350px;
    border-radius:
        50%;
    background:
        rgba(255,255,255,.08);
    right:
        -120px;
    bottom:
        -120px;
    animation:
        floatingCircle 9s
        ease-in-out infinite reverse;
}

.hero-content {
    position:
        relative;
    z-index:
        2;
    max-width:
        900px;
    animation:
        heroEnter 1.2s
        cubic-bezier(
            .22,
            1,
            .36,
            1
        );
}

.hero h1 {
    font-size:
        clamp(
            40px,
            7vw,
            72px
        );
    margin:
        0 0 20px;
    animation:
        titleReveal 1.4s ease;
}

.hero h2 {
    font-size:
        25px;
    font-weight:
        normal;
    opacity:
        .9;
    animation:
         faeUp 1.4s .2s both;
}

.hero p {
    font-size:
        18px;
    opacity:
        .85;
    animation:
        fadeUp 1.4s .4s both;
}

/* =========================================
   SECTIONS
========================================= */
section {
    width:
        85%;
    max-width:
        1100px;
    margin:
        90px auto;
}

section h2 {
    text-align:
        center;
    font-size:
        35px;
    margin-bottom:
        40px;
    position:
        relative;
}

section h2::after {
    content:
        "";
    display:
        block;
    width:
        0;
    height:
        4px;
    border-radius:
        10px;
    background:
        var(--primary);
    margin:
        12px auto;
    transition:
        width .5s ease;
}

section:hover h2::after {
    width:
        80px;
}

/* =========================================
   ABOUT
========================================= */

.about {

    max-width:
        850px;

    margin:
        auto;

    text-align:
        center;

    line-height:
        1.9;

    font-size:
        18px;

    color:
        var(--muted);

}


/* =========================================
   SKILLS
========================================= */

.skills {

    display:
        flex;

    flex-wrap:
        wrap;

    justify-content:
        center;

    gap:
        15px;

}


.skill {

    padding:
        12px 20px;

    border-radius:
        30px;

    background:
        var(--primary);

    color:
        white;

    cursor:
        default;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.1);

    transition:
        transform .3s,
        box-shadow .3s;

    animation:
        skillPop .7s both;

}


.skill:hover {

    transform:
        translateY(-8px)
        scale(1.08);

    box-shadow:
        0 15px 30px
        rgba(0,0,0,.2);

}


/* =========================================
   CARDS
========================================= */

.cards {

    display:
        grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(
                260px,
                1fr
            )
        );

    gap:
        25px;

}


.card {

    background:
        var(--card);

    padding:
        28px;

    border-radius:
        18px;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.08);

    line-height:
        1.7;

    transition:
        transform .4s ease,
        box-shadow .4s ease;

    animation:
        cardReveal .8s both;

}


.card:hover {

    transform:
        translateY(-12px)
        rotateX(2deg);

    box-shadow:
        0 25px 50px
        rgba(0,0,0,.15);

}


/* =========================================
   PROJECT CARDS
========================================= */

.project-card {

    position:
        relative;

    overflow:
        hidden;

}


.project-card::before {

    content:
        "";

    position:
        absolute;

    top:
        0;

    left:
        -100%;

    width:
        100%;

    height:
        4px;

    background:
        var(--primary);

    transition:
        .5s;

}


.project-card:hover::before {

    left:
        0;

}


.project-title {

    font-size:
        22px;

    font-weight:
        bold;

    margin-bottom:
        10px;

}


.project-description {

    color:
        var(--muted);

    margin-bottom:
        20px;

}


/* Project buttons */

.project-links {

    display:
        flex;

    flex-wrap:
        wrap;

    gap:
        10px;

}


.project-link {

    display:
        inline-block;

    padding:
        9px 15px;

    border-radius:
        8px;

    background:
        var(--primary);

    color:
        white;

    text-decoration:
        none;

    font-size:
        14px;

    transition:
        .3s;

}


.project-link:hover {

    transform:
        translateY(-3px)
        scale(1.05);

    opacity:
        .85;

}


/* =========================================
   SOCIAL LINKS
========================================= */

.social-links {

    display:
        flex;

    justify-content:
        center;

    flex-wrap:
        wrap;

    gap:
        15px;

}


.social-link {

    display:
        flex;

    align-items:
        center;

    gap:
        8px;

    padding:
        12px 20px;

    border-radius:
        10px;

    background:
        var(--card);

    color:
        var(--text);

    text-decoration:
        none;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.08);

    transition:
        .35s;

}


.social-link:hover {

    background:
        var(--primary);

    color:
        white;

    transform:
        translateY(-7px)

}


/* =========================================
   CONTACT
========================================= */

}

/* =========================================
   ANIMATIONS
========================================= */

@keyframes navDown {

    from {
        opacity: 0;
        transform:
            translateY(-40px);
    }

    to {
        opacity: 1;
        transform:
            translateY(0);
    }

}


@keyframes heroEnter {

    from {
        opacity: 0;
        transform:
            translateY(60px)
            scale(.94);
    }

    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }

}


@keyframes titleReveal {

    from {
        opacity: 0;
        transform:
            translateY(40px);
        letter-spacing:
            15px;
    }

    to {
        opacity: 1;
        transform:
            translateY(0);
        letter-spacing:
            normal;
    }

}


@keyframes fadeUp {

    from {
        opacity: 0;
        transform:
            translateY(30px);
    }

    to {
        opacity: 1;
        transform:
            translateY(0);
    }

}


@keyframes skillPop {

    from {
        opacity: 0;
        transform:
            scale(.5)
            translateY(20px);
    }

    to {
        opacity: 1;
        transform:
            scale(1)
            translateY(0);
    }

}


@keyframes cardReveal {

    from {
        opacity: 0;
        transform:
            translateY(60px)
            scale(.94);
    }

    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }

}


@keyframes gradientMove {

    0% {
        background-position:
            0% 50%;
    }

    50% {
        background-position:
            100% 50%;
    }

    100% {
        background-position:
            0% 50%;
    }

}


@keyframes floatingCircle {

    0% {
        transform:
            translate(0,0)
            scale(1);
    }

    50% {
        transform:
            translate(100px,80px)
            scale(1.2);
    }

    100% {
        transform:
            translate(0,0)
            scale(1);
    }

}

<script>


// ========================================
// GET PORTFOLIO DATA
// ========================================

const data =
    JSON.parse(
        localStorage.getItem(
            "portfolioData"
        )
    );


const selectedDesign =
    localStorage.getItem(
        "selectedDesign"
    ) || "1";


// ========================================
// CHECK DATA
// ========================================

if (!data) {

    alert(
        "No portfolio data found."
    );

    window.location.href =
        "/";

}


// ========================================
// APPLY DESIGN
// ========================================

document.body.classList.add(
    "design-" +
    selectedDesign
);


// ========================================
// BACKGROUND IMAGE
// ========================================

if (
    data.background &&
    data.background.trim()
) {

    document.body.classList.add(
        "custom-background"
    );


    document.documentElement.style
        .setProperty(
            "--custom-background",
            `url("${data.background}")`
        );

}


// ========================================
// BASIC DATA
// ========================================

document.getElementById(
    "portfolioName"
).textContent =
    data.name ||
    "Your Name";


document.getElementById(
    "portfolioEmail"
).textContent =
    data.email ||
    "";


document.getElementById(
    "portfolioAbout"
).textContent =
    data.about ||
    "Welcome to my portfolio.";


document.getElementById(
    "contactEmail"
).textContent =
    data.email
        ? "Email: " +
          data.email
        : "";


document.getElementById(
    "contactPhone"
).textContent =
    data.phone
        ? "Phone: " +
          data.phone
        : "";


// ========================================
// SKILLS
// ========================================

const skillsContainer =
    document.getElementById(
        "portfolioSkills"
    );


const skills =
    (data.skills || "")
        .split(",")
        .map(
            skill =>
                skill.trim()
        )
        .filter(Boolean);


skills.forEach(
    function(
        skill,
        index
    ) {

        const element =
            document.createElement(
                "span"
            );


        element.className =
            "skill";


        element.textContent =
            skill;


        element.style.animationDelay =
            (index * 0.1) +
            "s";


        skillsContainer.appendChild(
            element
        );

    }
);


// ========================================
// NORMAL CARDS
// ========================================

function createCards(
    containerId,
    value
) {

    const container =
        document.getElementById(
            containerId
        );


    if (!container) {
        return;
    }


    let items = [];


    if (
        Array.isArray(value)
    ) {

        items =
            value;

    } else {

        items =
            (value || "")
                .split("\n")
                .map(
                    item =>
                        item.trim()
                )
                .filter(Boolean);

    }


    if (
        items.length === 0
    ) {

        container.innerHTML =
            `
            <div class="card">
                No information added.
            </div>
            `;

        return;

    }


    items.forEach(
        function(
            item,
            index
        ) {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card";


            card.textContent =
                item;


            card.style.animationDelay =
                (index * 0.12) +
                "s";


            container.appendChild(
                card
            );

        }
    );

}


// ========================================
// PROJECT CARDS
// ========================================

function createProjectCards(
    projects
) {

    const container =
        document.getElementById(
            "portfolioProjects"
        );


    if (!container) {
        return;
    }


    if (
        !Array.isArray(projects) ||
        projects.length === 0
    ) {

        container.innerHTML =
            `
            <div class="card">
                No projects added.
            </div>
            `;

        return;

    }


    projects.forEach(
        function(
            project,
            index
        ) {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card project-card";


            card.style.animationDelay =
                (index * 0.15) +
                "s";


            const title =
                document.createElement(
                    "div"
                );


            title.className =
                "project-title";


            title.textContent =
                project.title ||
                "Project";


            card.appendChild(
                title
            );


            if (
                project.description
            ) {

                const description =
                    document.createElement(
                        "div"
                    );


                description.className =
                    "project-description";


                description.textContent =
                    project.description;


                card.appendChild(
                    description
                );

            }


            const links =
                document.createElement(
                    "div"
                );


            links.className =
                "project-links";


            if (
                project.github
            ) {

                const github =
                    document.createElement(
                        "a"
                    );


                github.href =
                    project.github;


                github.target =
                    "_blank";


                github.rel =
                    "noopener noreferrer";


                github.className =
                    "project-link";


                github.textContent =
                    "🐙 GitHub";


                links.appendChild(
                    github
                );

            }


            if (
                project.live
            ) {

                const live =
                    document.createElement(
                        "a"
                    );


                live.href =
                    project.live;


                live.target =
                    "_blank";


                live.rel =
                    "noopener noreferrer";


                live.className =
                    "project-link";


                live.textContent =
                    "🌐 Live Demo";


                links.appendChild(
                    live
                );

            }


            if (
                links.children.length
            ) {

                card.appendChild(
                    links
                );

            }


            container.appendChild(
                card
            );

        }
    );

}


// ========================================
// SOCIAL LINKS
// ========================================

function createSocialLinks() {

    const container =
        document.getElementById(
            "socialLinks"
        );


    if (!container) {
        return;
    }


    const socialPlatforms = [

        {
            name:
                "LinkedIn",

            icon:
                "💼",

            url:
                data.linkedin
        },

        {
            name:
                "GitHub",

            icon:
                "🐙",

            url:
                data.github
        },

        {
            name:
                "LeetCode",

            icon:
                "💻",

            url:
                data.leetcode
        },

        {
            name:
                "Kaggle",

            icon:
                "📊",

            url:
                data.kaggle
        },

        {
            name:
                "X / Twitter",

            icon:
                "𝕏",

            url:
                data.twitter
        },

        {
            name:
                "Website",

            icon:
                "🌐",

            url:
                data.website
        }

    ];


    socialPlatforms.forEach(
        function(platform) {

            if (
                !platform.url
            ) {
                return;
            }


            const link =
                document.createElement(
                    "a"
                );


            link.href =
                platform.url;


            link.target =
                "_blank";


            link.rel =
                "noopener noreferrer";


            link.className =
                "social-link";


            link.innerHTML =
                `
                <span>
                    ${platform.icon}
                </span>

                <span>
                    ${platform.name}
                </span>
                `;


            container.appendChild(
                link
            );

        }
    );


    if (
        container.children.length === 0
    ) {

        container.innerHTML =
            `
            <p>
                No social links added.
            </p>
            `;

    }

}

// ========================================

createCards(

);


createProjectCards(

);


createCards(

/* ========================================
   CERTIFICATE CARDS
======================================== */

function createCertificateCards(certifications) {

    const container =
        document.getElementById(
            "portfolioCertifications"
        );

    if (!container) {
        return;
    }

    container.innerHTML = "";

    if (!certifications) {

        container.innerHTML = `
            <div class="card">
                No certificates added.
            </div>
        `;

        return;
    }

    const items =
        Array.isArray(certifications)
            ? certifications
            : [certifications];

    if (items.length === 0) {

        container.innerHTML = `
            <div class="card">
                No certificates added.
            </div>
        `;

        return;
    }

    items.forEach(function(cert, index) {

        let title = "Certificate";
        let issuer = "";
        let verificationUrl = "";
        let pdfUrl = "";

        if (
            typeof cert === "object" &&
            cert !== null
        ) {

            title =
                cert.name ||
                cert.title ||
                cert.certificateName ||
                "Certificate";

            issuer =
                cert.issuer ||
                cert.organization ||
                "";

            verificationUrl =
                cert.link ||
                cert.verificationLink ||
                "";

            pdfUrl =
                cert.url ||
                cert.fileUrl ||
                cert.pdf ||
                cert.certificateUrl ||
                "";

        } else {

            title = String(cert);

        }

        const card =
            document.createElement("div");

        card.className =
            "card certificate-card";

        card.style.animationDelay =
            (index * 0.12) + "s";

        const titleElement =
            document.createElement("div");

        titleElement.className =
            "project-title";

        titleElement.textContent =
            "🏆 " + title;

        card.appendChild(
            titleElement
        );

        if (issuer) {

            const issuerElement =
                document.createElement("p");

            issuerElement.textContent =
                "Issued by: " + issuer;

            card.appendChild(
                issuerElement
            );

        }

        const links =
            document.createElement("div");

        links.className =
            "project-links";

        if (pdfUrl) {

            const viewButton =
                document.createElement("a");

            viewButton.href =
                pdfUrl;

            viewButton.target =
                "_blank";

            viewButton.rel =
                "noopener noreferrer";

            viewButton.className =
                "project-link";

            viewButton.textContent =
                "📄 View Certificate PDF";

            links.appendChild(
                viewButton
            );

            const downloadButton =
                document.createElement("a");

            downloadButton.href =
                pdfUrl;

            downloadButton.download =
                cert.fileName ||
                "certificate.pdf";

            downloadButton.className =
                "project-link";

            downloadButton.textContent =
                "⬇ Download PDF";

            links.appendChild(
                downloadButton
            );

        }

        if (verificationUrl) {

            const verifyButton =
                document.createElement("a");

            verifyButton.href =
                verificationUrl;

            verifyButton.target =
                "_blank";

            verifyButton.rel =
                "noopener noreferrer";

            verifyButton.className =
                "project-link";

            verifyButton.textContent =
                "🔗 Verify Certificate";

            links.appendChild(
                verifyButton
            );

        }

        if (links.children.length > 0) {

            card.appendChild(
                links
            );

        }

        container.appendChild(
            card
        );

    });

}

createCertificateCards(
    data.certifications
);  

createSocialLinks();

// ========================================

document.addEventListener(
    "mousemove",
    function(event) {

        const hero =
            document.querySelector(
                ".hero-content"
            );


        if (!hero) {
            return;
        }


        const x =
            (window.innerWidth / 2 -
            event.clientX) /
            80;


        const y =
            (window.innerHeight / 2 -
            event.clientY) /
            80;


        hero.style.transform =
            `
            translate(
                ${x}px,
                ${y}px
            )
            `;

    }
);
